<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WEBSITE JARVIS</title>
    <link rel="stylesheet" href="styles.css">
    <!-- <link rel="stylesheet" href="https://sets.hugeicons.com/YOUR-SET-ID.css" crossorigin="anonymous"> -->
</head>
<body>
    <nav>
        <h1 class="logo">FIT CLUB</h1>
      <div class="right-nav">
        <div class="select-box">
            <div class="select-heading"><span>All Workouts</span><img src="./assets/arrow.svg" alt="img"></div>
            <div class="options">
                <div class="option">Chest</div>
                <div class="option">Back</div>
                <div class="option">Legs</div>
                <div class="option">Shoulders</div>
                <div class="option">Arms</div>
            </div>
        </div>
            <img src="./assets/chatbot.svg" alt="chatbot" id="chatbotimg">
      </div>
    </nav>
    <main>
        <div class="chat-box">
            <div class="chat-container">
                <div class="h1">Talk to  your own Assistant...</div>
            </div>
            <div class="input-area">
                <input type="text " class="prompt" placeholder="Ask Anything...">
                <button><img src="./assets/btn.svg" alt="send"></button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
    
</body>
</html>
